
name: AI Trader 10 paper demo

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-trader-10-paper-demo
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --upgrade pip yfinance

      - name: Run paper-trading simulation
        run: python ai_trader_10.py

      - name: Save simulated portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          if [ -f trades.csv ]; then git add trades.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update AI Trader 10 paper-trading state"
            git push
          else
            echo "No changes to save."
          fi
